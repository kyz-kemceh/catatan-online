<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CatatanKu</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f4f5f8;color:#20232a;font-family:Arial,sans-serif}
header{padding:22px;background:#fff;border-bottom:1px solid #eee}
h1{margin:0;font-size:24px}
small{color:#777}
main{max-width:650px;margin:auto;padding:18px}
.card{background:white;border-radius:16px;padding:18px;margin-bottom:15px;box-shadow:0 3px 15px #00000008}
input,textarea{width:100%;padding:13px;border:1px solid #ddd;border-radius:10px;font-size:16px;margin:7px 0}
textarea{min-height:130px;resize:vertical}
button{border:0;border-radius:10px;padding:12px 16px;background:#242b42;color:white;font-size:15px;margin:4px;cursor:pointer}
.secondary{background:#e9ebf2;color:#222}
.danger{background:#ffe7e7;color:#a22}
.note{white-space:pre-wrap;overflow-wrap:anywhere}
#app,#resetBox,#signupBox{display:none}
#status{padding:12px;color:#555}
</style>
</head>
<body>

<header>
<h1>📝 CatatanKu</h1>
<small>Catatan tersimpan online</small>
</header>

<main>
<div id="status">Memuat...</div>

<div id="login" class="card" style="display:none">
<h3>Login Akun</h3>
<input id="email" type="email" placeholder="Gmail">
<input id="password" type="password" placeholder="Password">
<button onclick="login()">Masuk</button>
<button class="secondary" onclick="showSignup()">Daftar Akun Baru</button>
<button class="secondary" onclick="sendPasswordReset()">Lupa Password?</button>
</div>

<div id="signupBox" class="card">
<h3>Daftar Akun Baru</h3>
<input id="signupEmail" type="email" placeholder="Gmail kamu">
<input id="signupPassword" type="password" placeholder="Buat password">
<input id="signupConfirm" type="password" placeholder="Ulangi password">
<button onclick="signup()">Daftar Sekarang</button>
<button class="secondary" onclick="showLogin()">Kembali ke Login</button>
</div>

<div id="resetBox" class="card">
<h3>Ubah Password</h3>
<p>Masukkan password baru kamu.</p>
<input id="newPassword" type="password" placeholder="Password baru">
<input id="confirmNewPassword" type="password" placeholder="Ulangi password baru">
<button onclick="saveNewPassword()">Simpan Password Baru</button>
</div>

<div id="app">
<div class="card">
<input id="title" placeholder="Judul catatan">
<textarea id="content" placeholder="Tulis catatan di sini..."></textarea>
<button onclick="saveNote()">Simpan Catatan</button>
<button class="secondary" onclick="cancelEdit()">Batal Edit</button>
</div>
<div id="notes"></div>
<button class="secondary" onclick="logout()">Keluar Akun</button>
</div>

</main>

<script>
const SUPABASE_URL = "https://rqjfekjvbrhsiwhmzwsb.supabase.co";
const SUPABASE_KEY = "sb_publishable_HT_sp5dadZB_8CTGKdl4hw_yb07PgCi";

const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let currentUser = null;
let editingId = null;
let recoveryMode = false;

async function checkUser(){
  const {data:{session}} = await db.auth.getSession();
  currentUser = session?.user || null;
  showPage();
}

function showPage(){
  document.getElementById("status").style.display =
    currentUser || recoveryMode ? "none" : "block";

  document.getElementById("status").textContent = "Silakan login.";

  document.getElementById("login").style.display =
    currentUser || recoveryMode ? "none" : "block";

  document.getElementById("signupBox").style.display = "none";

  document.getElementById("resetBox").style.display =
    recoveryMode ? "block" : "none";

  document.getElementById("app").style.display =
    currentUser && !recoveryMode ? "block" : "none";

  if(currentUser && !recoveryMode) loadNotes();
}

function showSignup(){
  document.getElementById("login").style.display = "none";
  document.getElementById("signupBox").style.display = "block";
}

function showLogin(){
  document.getElementById("signupBox").style.display = "none";
  document.getElementById("login").style.display = "block";
}

async function signup(){
  const email = document.getElementById("signupEmail").value.trim();
  const password = document.getElementById("signupPassword").value;
  const confirm = document.getElementById("signupConfirm").value;

  if(!email || !password || !confirm)
    return alert("Lengkapi semua kolom.");

  if(password.length < 8)
    return alert("Password minimal 8 karakter.");

  if(password !== confirm)
    return alert("Konfirmasi password tidak sama.");

  const {data,error} = await db.auth.signUp({
    email,
    password,
    options:{
      emailRedirectTo:window.location.origin
    }
  });

  if(error) return alert(error.message);

  if(data.session){
    currentUser = data.user;
    alert("Pendaftaran berhasil!");
    showPage();
  }else{
    alert("Pendaftaran berhasil. Silakan periksa Gmail kamu untuk konfirmasi akun.");
    document.getElementById("signupPassword").value = "";
    document.getElementById("signupConfirm").value = "";
    showLogin();
  }
}

async function login(){
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  const {data,error} = await db.auth.signInWithPassword({
    email,password
  });

  if(error) return alert(error.message);

  currentUser = data.user;
  showPage();
}

async function sendPasswordReset(){
  const email = document.getElementById("email").value.trim();

  if(!email) return alert("Masukkan Gmail akun terlebih dahulu.");

  const {error} = await db.auth.resetPasswordForEmail(email,{
    redirectTo:window.location.origin
  });

  if(error) return alert(error.message);

  alert("Link pemulihan dikirim. Periksa Gmail kamu.");
}

async function saveNewPassword(){
  const pw = document.getElementById("newPassword").value;
  const confirmPw = document.getElementById("confirmNewPassword").value;

  if(pw.length < 8)
    return alert("Password minimal 8 karakter.");

  if(pw !== confirmPw)
    return alert("Konfirmasi password tidak sama.");

  const {error} = await db.auth.updateUser({password:pw});

  if(error) return alert(error.message);

  alert("Password berhasil diubah!");

  recoveryMode = false;
  showPage();
}

async function logout(){
  await db.auth.signOut();
  currentUser = null;
  cancelEdit();
  showPage();
}

async function loadNotes(){
  const {data,error} = await db.from("notes")
    .select("*").order("created_at",{ascending:false});

  if(error) return alert("Gagal memuat: "+error.message);

  const area = document.getElementById("notes");
  area.innerHTML = "";

  data.forEach(note=>{
    const box = document.createElement("div");
    box.className = "card";

    const h = document.createElement("h3");
    h.textContent = note.title || "(Tanpa judul)";

    const p = document.createElement("div");
    p.className = "note";
    p.textContent = note.content || "";

    const date = document.createElement("small");
    date.textContent = note.created_at
      ? new Date(note.created_at).toLocaleString("id-ID")
      : "";

    const edit = document.createElement("button");
    edit.textContent = "Edit";
    edit.className = "secondary";
    edit.onclick = ()=>editNote(note);

    const del = document.createElement("button");
    del.textContent = "Hapus";
    del.className = "danger";
    del.onclick = ()=>deleteNote(note.id);

    box.append(h,p,date,edit,del);
    area.appendChild(box);
  });
}

async function saveNote(){
  const title = document.getElementById("title").value.trim();
  const content = document.getElementById("content").value.trim();

  if(!title && !content)
    return alert("Catatan masih kosong.");

  let result;

  if(editingId){
    result = await db.from("notes")
      .update({title,content})
      .eq("id",editingId);
  }else{
    result = await db.from("notes").insert({
      title,content,user_id:currentUser.id
    });
  }

  if(result.error) return alert(result.error.message);

  cancelEdit();
  loadNotes();
}

function editNote(note){
  editingId = note.id;
  document.getElementById("title").value = note.title || "";
  document.getElementById("content").value = note.content || "";
  window.scrollTo({top:0,behavior:"smooth"});
}

function cancelEdit(){
  editingId = null;
  document.getElementById("title").value = "";
  document.getElementById("content").value = "";
}

async function deleteNote(id){
  if(!confirm("Hapus catatan ini?")) return;

  const {error} = await db.from("notes").delete().eq("id",id);

  if(error) return alert(error.message);

  loadNotes();
}

db.auth.onAuthStateChange((event,session)=>{
  currentUser = session?.user || null;

  if(event === "PASSWORD_RECOVERY"){
    recoveryMode = true;
  }

  showPage();
});

checkUser();
</script>
</body>
</html>
